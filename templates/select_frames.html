<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Frames</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 700px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
        }
        #frames {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .frame {
            border: 2px solid transparent;
            cursor: pointer;
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .frame.selected {
            border-color: #4CAF50;
        }
        button {
            margin-top: 20px;
            padding: 0.5rem 1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Frames</h1>
        <div id="frames"></div>
        <button id="generate-pdf">Generate PDF</button>
    </div>

    <script>
        const framesContainer = document.getElementById('frames');
        const generatePdfButton = document.getElementById('generate-pdf');

        // Parse the frame URLs from the query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const frames = urlParams.get('frames').split(',');

        function displayFrames(frames) {
            framesContainer.innerHTML = '';
            frames.forEach((frame, index) => {
                const img = document.createElement('img');
                img.src = frame;
                img.classList.add('frame');
                img.dataset.index = index;
                img.addEventListener('click', function() {
                    img.classList.toggle('selected');
                });
                framesContainer.appendChild(img);
            });
        }

        displayFrames(frames);

        generatePdfButton.addEventListener('click', function() {
            const selectedFrames = Array.from(document.querySelectorAll('.frame.selected')).map(img => img.dataset.index);

            fetch('/generate_pdf', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ selected_frames: selectedFrames })
            })
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'output.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
