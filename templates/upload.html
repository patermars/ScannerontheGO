<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video to PDF Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input[type="file"] {
            margin-bottom: 1rem;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        #frames {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .frame {
            border: 2px solid transparent;
            cursor: pointer;
            width: 100px; 
            height: 100px;
            object-fit: cover;
        }
        .frame.selected {
            border-color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video to PDF Converter</h1>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" name="file" accept="video/*">
            <input type="submit" value="Upload Video">
        </form>
        <div id="frames"></div>
        <button id="generate-pdf" style="display:none;">Generate PDF</button>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const framesContainer = document.getElementById('frames');
        const generatePdfButton = document.getElementById('generate-pdf');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                displayFrames(data.frames);
            })
            .catch(error => console.error('Error:', error));
        });

        function displayFrames(frames) {
            framesContainer.innerHTML = '';
            frames.forEach((frame, index) => {
                const img = document.createElement('img');
                img.src = frame;
                img.classList.add('frame');
                img.dataset.index = index;
                img.addEventListener('click', function() {
                    img.classList.toggle('selected');
                });
                framesContainer.appendChild(img);
            });
            generatePdfButton.style.display = 'block';
        }

        generatePdfButton.addEventListener('click', function() {
            const selectedFrames = Array.from(document.querySelectorAll('.frame.selected'))
                                        .map(img => img.dataset.index);

            fetch('/generate_pdf', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ selected_frames: selectedFrames })
            })
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'output.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
